services:
  - type: web
    name: credify-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NETWORK
        value: sepolia
      - key: SEPOLIA_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: DEMO_MNEMONIC
        value: "spatial fee custom engine miracle grain flame swift animal twin stand quality"
      - key: CORS_ORIGIN
        value: "*"
      - key: DEMO_MODE
        value: "true"
      - key: TERMS_PARSER
        value: demo
